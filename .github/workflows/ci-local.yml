name: Java & Docker CI

on:
  push:
    branches: ["main","develop"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: "1. Download code"
        uses: actions/checkout@v4

      - name: "2. Configurar JDK 21"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: "3 Permises exec"
        run: chmod +x gradlew

      - name: "4. Compilar test"
        run: ./gradlew test

      - name: "5. Validate docker"
        run: docker build -t somosmelo-api:local .
